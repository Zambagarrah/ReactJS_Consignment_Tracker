<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up / Login - Demo</title>
  <!-- Use a relative path so the CSS loads when opened directly or when served by Vite -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div class="auth-container">
    <div class="form-box">
      <!-- Signup Form -->
      <form id="signup-form" class="form active" novalidate>
        <h2>✨ Create Account</h2>
        <input type="text" placeholder="Full Name" required />
        <input type="email" placeholder="Email Address" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Sign Up</button>
        <p>Already have an account? <a href="#" id="login-link">Login</a></p>
      </form>

      <!-- Login Form -->
      <form id="login-form" class="form" novalidate>
        <h2>💫 Welcome Back</h2>
        <input type="email" placeholder="Email Address" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Login</button>
        <p>Don’t have an account? <a href="#" id="signup-link">Sign Up</a></p>
      </form>
    </div>
  </div>

  <script>
    // Toggling forms so only one is visible and interactive at a time
    const signupForm = document.getElementById('signup-form');
    const loginForm = document.getElementById('login-form');
    const loginLink = document.getElementById('login-link');
    const signupLink = document.getElementById('signup-link');

    // initialize ARIA states
    signupForm.setAttribute('aria-hidden', 'false');
    loginForm.setAttribute('aria-hidden', 'true');

    function showForm(toShow, toHide) {
      // remove active from hidden form after a small delay to allow transition
      toHide.classList.remove('active');
      toHide.setAttribute('aria-hidden', 'true');

      // make target visible and interactive
      toShow.classList.add('active');
      toShow.setAttribute('aria-hidden', 'false');
    }

    loginLink.addEventListener('click', (e) => {
      e.preventDefault();
      showForm(loginForm, signupForm);
    });

    signupLink.addEventListener('click', (e) => {
      e.preventDefault();
      showForm(signupForm, loginForm);
    });
  </script>

</body>
</html>
